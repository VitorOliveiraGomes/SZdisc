[package]
name = "disc2"
version = "2.11.0"
edition = "2021"
authors = ["Vitor Oliveira Gomes"]
description = "SZdisc - Aplicativo nativo ultra-leve em Rust para transmissao de tela e audio em 1080p 60fps"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
jpeg-encoder = { version = "0.6", features = ["simd"] }
zune-jpeg = "0.4"
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "winuser",
  "wingdi",
  "windef",
  "winbase",
  "winnt",
  "winerror",
  "handleapi",
  "synchapi",
  "unknwnbase",
  "processthreadsapi",
  "psapi",
  "libloaderapi",
  "commdlg",
  "dwmapi",
  "d3d11",
  "dxgi",
  "dxgi1_2",
  "mmdeviceapi",
  "audioclient",
  "audiosessiontypes",
  "combaseapi",
  "objbase",
  "mmsystem",
  "timeapi",
  "mmeapi",
  "mmreg",
  "wininet"
] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"
cpal = "0.15"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
debug = false
