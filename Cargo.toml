[package]
name = "disc2"
version = "2.9.2"
edition = "2021"
authors = ["Vitor Oliveira Gomes"]
description = "SZdisc - Aplicativo nativo ultra-leve em Rust para transmissao de tela e audio em 1080p 60fps"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
winapi = { version = "0.3", features = [
  "winuser",
  "wingdi",
  "windef",
  "winbase",
  "winnt",
  "handleapi",
  "synchapi",
  "unknwnbase",
  "processthreadsapi",
  "psapi",
  "libloaderapi",
  "commdlg",
  "dwmapi",
  "mmdeviceapi",
  "audioclient",
  "audiosessiontypes",
  "combaseapi",
  "objbase",
  "mmsystem",
  "mmeapi",
  "mmreg",
  "wininet"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
debug = false
