[package]
name = "screenz"
version = "2.11.0"
edition = "2021"
authors = ["Vitor Oliveira Gomes"]
description = "ScreenZ - Estudio desktop para compartilhar telas e audio em boa companhia"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
jpeg-encoder = { version = "0.6", features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "winuser",
  "wingdi",
  "windef",
  "winbase",
  "winnt",
  "winerror",
  "handleapi",
  "synchapi",
  "unknwnbase",
  "processthreadsapi",
  "psapi",
  "libloaderapi",
  "commdlg",
  "dwmapi",
  "d3d11",
  "dxgi",
  "dxgi1_2",
  "mmdeviceapi",
  "audioclient",
  "audiosessiontypes",
  "combaseapi",
  "objbase",
  "mmsystem",
  "timeapi",
  "mmeapi",
  "mmreg",
  "wininet"
] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"
cpal = "0.15"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
debug = false
